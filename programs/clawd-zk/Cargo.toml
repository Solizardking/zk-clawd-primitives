[package]
name = "clawd-zk"
version = "0.2.0"
description = "ZK primitive for Solana Clawd AI model attestations: nullifiers, Groth16 proofs, compressed state via Light Protocol"
edition = "2021"
rust-version = "1.84"
license = "Apache-2.0"
repository = "https://github.com/Solizardking/zk-clawd-primitives"

[lib]
crate-type = ["cdylib", "lib"]
name = "clawd_zk"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Pinned exactly: Light's program-examples (zk-id) use this combination.
anchor-lang = "=0.31.1"
light-sdk = { version = "=0.17.1", features = ["anchor", "v2"] }
light-sdk-types = { version = "=0.17.1", features = ["v2"] }
groth16-solana = "=0.3.1"
borsh = "0.10.4"
clawd-zk-core = { path = "../../crates/clawd-zk-core" }

[dev-dependencies]
# Host-side keccak for Light address derivation in tests (on-chain uses the syscall).
light-sdk = { version = "=0.17.1", features = ["anchor", "v2", "keccak"] }
ark-bn254 = "0.6"
ark-ec = "0.6"
ark-ff = "0.6"
ark-groth16 = "0.6"
ark-relations = "0.6"
ark-serialize = "0.6"
ark-snark = "0.6"
ark-std = "0.6"
